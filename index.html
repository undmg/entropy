<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTROPY // 3D STATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #e0e0e0;
            --neon-purple: #8b2fc9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Text Container */
        #text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            mix-blend-mode: overlay;
        }

        .phrase {
            font-size: 2.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 2s ease;
            text-shadow: 0 0 20px var(--neon-purple);
            position: absolute;
            width: 100%;
            left: 0;
            font-weight: bold;
        }

        .phrase.active {
            opacity: 1;
        }

        /* Start Overlay */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            pointer-events: auto;
        }

        #start-text {
            border: 1px solid var(--neon-purple);
            padding: 20px 50px;
            color: var(--neon-purple);
            letter-spacing: 5px;
            font-size: 1.5rem;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(139, 47, 201, 0.3);
            transition: all 0.4s ease;
        }

        #start-text:hover {
            background: var(--neon-purple);
            color: black;
            box-shadow: 0 0 60px rgba(139, 47, 201, 0.8);
            transform: scale(1.05);
        }

        .disclaimer {
            font-size: 0.8rem;
            color: #666;
            margin-top: 30px;
            letter-spacing: 3px;
        }

        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #333;
            font-size: 0.7rem;
        }
    </style>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="ui-layer">
        <div id="text-container">
            <div class="phrase">What if this isn't the original timeline?</div>
            <div class="phrase">Entropy doesn't destroy, it rearranges.</div>
            <div class="phrase">Speed doesn't silence thoughts.</div>
            <div class="phrase">Time is fluid in the dark.</div>
            <div class="phrase">We are just static in the void.</div>
        </div>
        <div id="loading">...LOADING NEURAL LINK...</div>
    </div>

    <div id="start-overlay">
        <div id="start-text">ENTER THE VOID</div>
        <div class="disclaimer">HEADPHONES REQUIRED // 3D EXPERIENCE</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- CONFIG ---
        const AUDIO_PATH = 'entropy.mp3';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- OBJECTS ---

        // 1. The Core (Deforming Sphere)
        const geometry = new THREE.IcosahedronGeometry(1.5, 4); // High detail for displacement
        const material = new THREE.MeshStandardMaterial({
            color: 0x2e004f,
            wireframe: true,
            emissive: 0x8b2fc9,
            emissiveIntensity: 0.5,
            roughness: 0.1,
            metalness: 0.9
        });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        // Store original positions for deformation
        const positionAttribute = geometry.getAttribute('position');
        const originalPositions = Array.from(positionAttribute.array);

        // 2. Particle Field (Stars/Dust)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 40; // Spread out
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: 0xb026ff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);

        // 3. Ambient Lights
        const pointLight = new THREE.PointLight(0xff00ff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0x5500ff, 1);
        pointLight2.position.set(-5, -5, -5);
        scene.add(pointLight2);

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);

        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.2; // Intense bloom
        bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        const glitchPass = new GlitchPass();
        glitchPass.goWild = false;
        glitchPass.enabled = false; // Triggered by audio
        composer.addPass(glitchPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // --- AUDIO SYSTEM ---
        let audioContext, analyser, source, dataArray;
        let audioElement;
        let isSimulation = false;
        let isPlaying = false;

        function initAudio() {
            if (isPlaying) return;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioElement = new Audio(AUDIO_PATH);
            audioElement.loop = true;

            try {
                source = audioContext.createMediaElementSource(audioElement);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                isSimulation = false;
            } catch (e) {
                console.warn("CORS Restricted. Simulation Mode Engaged.");
                isSimulation = true;
                dataArray = null;
            }

            audioElement.play().then(() => {
                isPlaying = true;
                document.getElementById('start-overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('start-overlay').remove(), 1000);

                animate();
                cycleText();
            }).catch(e => console.error(e));
        }

        // --- ANIMATION PIPELINE ---

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.002;

            // Audio Analysis
            let bass = 0, mid = 0, high = 0;

            if (!isSimulation && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                bass = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
                mid = dataArray.slice(20, 100).reduce((a, b) => a + b, 0) / 80;
                high = dataArray.slice(100, 200).reduce((a, b) => a + b, 0) / 100;
            } else {
                // Simulation
                bass = (Math.sin(time * 4) * 0.5 + 0.5) * 150 + (Math.random() * 50);
                mid = 50 + Math.random() * 50;
                high = (Math.random() > 0.95) ? 150 : 0;
            }

            const bassNorm = bass / 255;
            const midNorm = mid / 255;

            // 1. Core Deformation (Vertex Shader-like effect on CPU)
            // Heavy calculation? Maybe simplify for performance if needed, but 1.5/4 Ico is okay.
            const positions = geometry.getAttribute('position');
            const count = positions.count;

            for (let i = 0; i < count; i++) {
                const ox = originalPositions[i * 3];
                const oy = originalPositions[i * 3 + 1];
                const oz = originalPositions[i * 3 + 2];

                // Noise-like displacement based on time + audio
                const noise = Math.sin(ox * 2 + time * 2) * Math.cos(oy * 2 + time);
                const displace = 1 + (noise * midNorm * 0.5) + (bassNorm * 0.3);

                positions.setXYZ(i, ox * displace, oy * displace, oz * displace);
            }
            positions.needsUpdate = true;

            // Core Rotation & Color
            core.rotation.y += 0.005 + (bassNorm * 0.02);
            core.rotation.z += 0.002;

            // Dynamic Color Shift
            const hue = (0.75 + (bassNorm * 0.1)) % 1; // Purple to Pink/Red
            material.emissive.setHSL(hue, 0.8, 0.5 * bassNorm + 0.2);

            // 2. Camera Movement (Dreamlike Orbit)
            // 2. Camera Movement (Dreamlike Orbit) - Slowed & damped
            camera.position.x = Math.sin(time * 0.2) * (5 + midNorm * 0.5);
            camera.position.y = Math.cos(time * 0.3) * (2 + bassNorm * 0.5);
            camera.position.z = Math.cos(time * 0.2) * (5 + midNorm * 0.5);
            camera.lookAt(0, 0, 0);

            // Subtle Shake on Bass
            if (bass > 200) {
                camera.position.x += (Math.random() - 0.5) * 0.2;
                camera.position.y += (Math.random() - 0.5) * 0.2;
            }

            // 3. Particles
            particleMesh.rotation.y -= 0.002;
            particlesMaterial.size = 0.03 + (high / 255) * 0.05;

            // 4. Glitch Effect Trigger
            glitchPass.enabled = (high > 180 || (Math.random() > 0.99 && bass > 200));

            // Render
            composer.render();
        }

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- TEXT CYCLE (From previous version) ---
        const phrases = document.querySelectorAll('.phrase');
        let currentPhrase = 0;

        function cycleText() {
            phrases.forEach(p => p.classList.remove('active'));
            phrases[currentPhrase].classList.add('active');
            currentPhrase = (currentPhrase + 1) % phrases.length;
            setTimeout(cycleText, 5000 + Math.random() * 3000);
        }

        // --- BIND START ---
        document.getElementById('start-overlay').addEventListener('click', initAudio);

    </script>
</body>

</html>
